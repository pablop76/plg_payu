; Wiadomości do sprzedawcy
PLG_HIKASHOPPAYMENT_PAYU_ALERT_SUBJECT="PayU: płatność za zamówienie %s wymaga uwagi"
PLG_HIKASHOPPAYMENT_PAYU_ALERT_MISMATCH="PayU zgłasza zrealizowaną płatność za zamówienie %1$s (zamówienie PayU %2$s), ale kwota się nie zgadza: wpłata %3$s, zamówienie %4$s. Wtyczka NIE oznaczyła zamówienia jako opłaconego. Sprawdź płatność w panelu PayU i zdecyduj, co dalej."
PLG_HIKASHOPPAYMENT_PAYU_ALERT_WAITING="Płatność za zamówienie %1$s (zamówienie PayU %2$s) wpłynęła, ale czeka w PayU na ręczne przyjęcie (stan WAITING_FOR_CONFIRMATION). Zamówienie w sklepie zostaje nieopłacone, dopóki nie przyjmiesz płatności w panelu PayU. Żeby płatności przyjmowały się same, włącz automatyczny odbiór w ustawieniach punktu płatności."
